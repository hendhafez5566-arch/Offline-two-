<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elhafez Tourism</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f6f9fc;color:#16304d}body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,430px);background:#fff;border:1px solid #dce7f1;border-radius:24px;padding:28px;box-sizing:border-box;box-shadow:0 16px 50px rgba(8,34,67,.12);text-align:center}.brand{background:linear-gradient(145deg,#071d3d,#0d4973);color:#fff;border-radius:18px;padding:22px 16px;margin-bottom:22px}.brand small{display:block;opacity:.78;letter-spacing:.08em}.brand b{display:block;font-size:30px;margin-top:4px}.brand span{display:block;color:#4ad9f4;font-weight:800;margin-top:3px}.icon{font-size:38px;margin:8px 0}.card h1{font-size:23px;margin:6px 0}.card p{color:#6d7f92;line-height:1.8;margin:8px 0 20px}.retry{width:100%;border:0;border-radius:14px;padding:14px 18px;background:#155a93;color:#fff;font:inherit;font-weight:800;font-size:17px}.hint{display:block;margin-top:13px;color:#8a98a8;font-size:13px}
</style>
</head>
<body>
  <main class="card">
    <section class="brand"><small>Elhafez Technology</small><b>Elhafez</b><span>Tourism &amp; Umrah ERP</span></section>
    <div class="icon">⌁</div>
    <h1>تعذر الاتصال بالخادم</h1>
    <p>التطبيق لم يتمكن من الوصول إلى نظام الشركة الآن. تأكد من الإنترنت ثم أعد المحاولة.</p>
    <button class="retry" onclick="location.href='https://zonal-charm-production.up.railway.app/?source=android-retry'">إعادة المحاولة</button>
    <span class="hint">لن يتم حذف أي بيانات من جهازك.</span>
  </main>
</body>
</html>
