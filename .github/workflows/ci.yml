name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the application / business / presentation differential checks read the pre-Part-2 commits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix server ci
      - name: Install browser QA runtime for golden output
        run: pip install -r qa-requirements.txt && python -m playwright install --with-deps chromium
      - name: Client typecheck
        run: npm run typecheck
      - name: Build client (esbuild) and server
        run: npm run build
      - name: Module graph (order, orphans, cycles, duplicate evaluations)
        run: npm run module:check
      - name: Architecture ratchet
        run: npm run architecture:check
      - name: Type ratchet (any, suppressions, noImplicitAny, strictNullChecks may only go down)
        run: npm run types:ratchet
      - name: Presentation gate integrity hash
        run: sha256sum scripts/presentation-platform-check.mjs
      # Known baseline failures are allowed ONLY as recorded in docs/refactor/refactor-baseline.json.
      # Any new failure, test-inventory drift or pinned-file drift fails this job. No continue-on-error anywhere.
      - name: Release gate (aggregate)
        run: npm run release:check
  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix server ci
      - run: pip install -r qa-requirements.txt && python -m playwright install --with-deps chromium
      - name: Golden print output (invoices, vouchers, statements must stay byte-identical)
        run: npm run test:golden
      - name: Release gate including browser acceptance
        run: npm run release:check -- --with-browser
  # Style gate (Prettier + ESLint). Dormant until the one-time tooling install is committed
  # (docs/refactor/PART3_TOOLING_SETUP.md). Enable it by creating the repository variable STYLE_GATE=on.
  style:
    if: ${{ vars.STYLE_GATE == 'on' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:ratchet
